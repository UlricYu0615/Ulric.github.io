<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulric's Space</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --accent-color: #a855f7;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2d3436;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover; /* 确保图片不会被拉伸变形 */
            margin: 0 auto 1.5rem;
            display: block; /* 改为 block 居中 */
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            border: 3px solid white; /* 给头像加个白边更好看 */
        }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: -0.5px; }
        p { color: #636e72; line-height: 1.6; margin: 1rem 0 2rem; }
        .social-links { display: flex; justify-content: center; gap: 15px; }
        .social-links a {
            padding: 10px 20px;
            border-radius: 12px;
            background: white;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            border: 1px solid #eee;
        }
        .social-links a:hover {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }
        .portfolio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 分成两列 */
            gap: 15px;
            margin-top: 1rem;
        }
        .project-card {
            background: rgba(255, 255, 255, 0.5);
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .project-card:hover {
            background: white;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .project-card h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: var(--primary-color);
        }

        .project-card p {
            font-size: 0.8rem;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        .project-card a {
            font-size: 0.8rem;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        /* 手机端适配：改为单列显示 */
        @media (max-width: 480px) {
            .portfolio-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Shopee-Sg300x250.png" class="avatar" alt="Ulric的头像">
        <h1>Ulric</h1>
        <p>🚀 终身学习者 / 开发者 / 创意探索者<br>正在通过代码构建我的数字花园。</p>
        <div class="social-links">
            <a href="https://github.com/ulricyu0615" target="_blank">GitHub</a>
            <a href="#">知乎</a>
            <a href="mailto:your-email@example.com">联系我</a>
        </div>
        <h2 style="margin-top: 2rem; font-size: 1.2rem; color: #333;">我的作品集</h2>
        <div class="portfolio-grid">
            <div class="project-card">
                <h3>项目名称 A</h3>
                <p>简短描述一下这个项目的功能或意义。</p>
                <a href="#">查看详情 →</a>
            </div>
            <div class="project-card">
                <h3>项目名称 B</h3>
                <p>另一个有趣的尝试，展示你的多元化。</p>
                <a href="#">查看详情 →</a>
            </div>
        </div>
    </div>
</body>
</html>
